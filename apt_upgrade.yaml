---
- name: Update packages and check reboot requirement
  hosts: debian
  become: yes
  gather_facts: yes
  ignore_unreachable: true
  any_errors_fatal: false
  tasks:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Count upgradable APT packages before upgrade
      ansible.builtin.shell: apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: upgradable_before
      changed_when: false

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
      register: apt_upgrade_result

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Set facts for reporting
      ansible.builtin.set_fact:
        needs_reboot: "{{ reboot_required_file.stat.exists }}"
        updated_count: "{{ upgradable_before.stdout | default('0') | int }}"
      when: reboot_required_file is defined and reboot_required_file.stat is defined

- name: Notify Discord about update results
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Build message content
      ansible.builtin.set_fact:
        discord_message: |
          📦 **Update-Report**
          {% for host in groups['debian'] %}
          {% if hostvars[host].needs_reboot is defined %}
          **{{ host }}**: {{ hostvars[host].updated_count | default(0) }} Pakete aktualisiert{{ ' ⚠️ Neustart empfohlen' if hostvars[host].needs_reboot else '' }}
          {% else %}
          **{{ host }}**: ⛔ nicht erreichbar
          {% endif %}
          {% endfor %}

    - name: Send Discord notification
      ansible.builtin.uri:
        url: "{{ webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "{{ discord_message }}"
        status_code: 204
      check_mode: false
