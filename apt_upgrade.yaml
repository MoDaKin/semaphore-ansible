---
- name: Update packages and check reboot requirement
  hosts: debian
  become: yes
  user: root
  gather_facts: yes
  tasks:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
      register: apt_upgrade_result

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Set facts for reporting
      ansible.builtin.set_fact:
        needs_reboot: "{{ reboot_required_file.stat.exists }}"
        updated_count: "{{ apt_upgrade_result.changes.installed | default([]) | length if apt_upgrade_result.changes is defined else 0 }}"

- name: Notify Discord about update results
  hosts: localhost
  gather_facts: no
  vars:
    reboot_lines: >-
      {{ groups['debian']
         | map('extract', hostvars)
         | selectattr('needs_reboot', 'defined')
         | selectattr('needs_reboot')
         | map(attribute='inventory_hostname')
         | list }}
    summary_lines: >-
      {{ groups['debian']
         | map('extract', hostvars)
         | map(attribute='inventory_hostname')
         | zip(groups['debian'] | map('extract', hostvars) | map(attribute='updated_count', default=0))
         | list }}
  tasks:
    - name: Build message content
      ansible.builtin.set_fact:
        discord_message: |
          📦 **Update-Report**
          {% for host in groups['debian'] %}
          **{{ host }}**: {{ hostvars[host].updated_count | default(0) }} Pakete aktualisiert{{ ' ⚠️ Neustart empfohlen' if hostvars[host].needs_reboot | default(false) else '' }}
          {% endfor %}

    - name: Send Discord notification
      ansible.builtin.uri:
        url: "{{ webhook_url }}" #Variable in Variable Groupe in Semaphore einrichten und für den Task auswählen, damit keine Secrets im Playbook landen.
        method: POST
        body_format: json
        body:
          content: "{{ discord_message }}"
        status_code: 204
