---
- name: Check for new Docker Compose image versions
  hosts: docker
  gather_facts: no
  ignore_unreachable: true
  any_errors_fatal: false
  tasks:
    - name: Discover compose project directories
      ansible.builtin.shell: |
        for d in /docker; do
          if [ -f "${d}compose.yaml" ]; then
            echo "${d%/}"
          fi
        done
      args:
        executable: /bin/bash
      register: docker_dirs_raw
      changed_when: false

    - name: Set project directory list
      ansible.builtin.set_fact:
        docker_dirs: "{{ docker_dirs_raw.stdout_lines }}"
      when: docker_dirs_raw is defined and docker_dirs_raw.stdout_lines is defined

    - name: Ensure skopeo is installed
      ansible.builtin.apt:
        name: skopeo
        state: present

    - name: Check each project for image updates via registry digest
      ansible.builtin.shell: |
        cd {{ item }}
        services=($(docker compose config --services))
        images=($(docker compose config --images))
        changed=""
        for i in "${!services[@]}"; do
          svc="${services[$i]}"
          img="${images[$i]}"
          local_digest=$(docker image inspect "$img" --format {% raw %}'{{index .RepoDigests 0}}'{% endraw %} 2>/dev/null | cut -d'@' -f2)
          remote_digest=$(skopeo inspect "docker://$img" --format {% raw %}'{{.Digest}}'{% endraw %} 2>/dev/null)
          if [ -n "$remote_digest" ] && [ "$local_digest" != "$remote_digest" ]; then
            changed="${changed}${svc},"
          fi
        done
        echo "${changed%,}"
      args:
        executable: /bin/bash
      register: project_check
      loop: "{{ docker_dirs }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false
      when: docker_dirs is defined and docker_dirs | length > 0

    - name: Set fact with update summary
      ansible.builtin.set_fact:
        docker_updates: >-
          {{ project_check.results
             | selectattr('stdout', 'ne', '')
             | map(attribute='item')
             | zip(project_check.results | selectattr('stdout', 'ne', '') | map(attribute='stdout'))
             | list }}
      when: project_check.results is defined

- name: Notify Discord about available image updates
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Build message content
      ansible.builtin.set_fact:
        discord_message: |
          🔍 **Docker Image Update-Check**
          {% for host in groups['docker'] %}
          {% if hostvars[host].docker_updates is defined %}
          {% if hostvars[host].docker_updates | length > 0 %}
          **{{ host }}**:
          {% for entry in hostvars[host].docker_updates %}
          - {{ entry[0] }}: {{ entry[1] }}
          {% endfor %}
          {% else %}
          **{{ host }}**: ✅ alles aktuell
          {% endif %}
          {% else %}
          **{{ host }}**: ⛔ nicht erreichbar
          {% endif %}
          {% endfor %}

    - name: Send Discord notification
      ansible.builtin.uri:
        url: "{{ webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "{{ discord_message }}"
        status_code: 204
      check_mode: false
