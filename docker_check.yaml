---
- name: Update Docker Compose services
  hosts: docker
  gather_facts: no
  tasks:
  
    - name: Pull images
      community.docker.docker_compose_v2_pull:
        project_src: /docker
      register: output_pull

    - name: Show results
      ansible.builtin.debug:
        var: output_pull

    - name: Run `docker compose up`
      community.docker.docker_compose_v2:
        project_src: /docker
      register: output_up

    - name: Show results
      ansible.builtin.debug:
        var: output_up
