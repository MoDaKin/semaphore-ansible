---
- name: Update Docker Compose services
  hosts: all
  gather_facts: no
  tasks:

    - name: Connectivity check
      ansible.builtin.ping:
      ignore_unreachable: true
      ignore_errors: true
      register: connection_test

    - name: Nicht erreichbare Hosts überspringen
      meta: end_host
      when: connection_test is unreachable or connection_test is failed

    - name: Pull images
      community.docker.docker_compose_v2_pull:
        project_src: "{{ docker_dir }}"
      register: output_pull

    - name: Run `docker compose up`
      community.docker.docker_compose_v2:
        project_src: "{{ docker_dir }}"
      register: output_up

    - name: Debug Actions-Struktur
      ansible.builtin.debug:
        var: output_up.actions

    - name: Prune Image
      community.docker.docker_prune:
        images: true
      register: output_prune

    - name: Aktualisierte Services ermitteln
      set_fact:
        changed_services: "{{ output_up.actions | default([]) | map(attribute='service') | unique | list }}"
      when: output_up.changed | default(false)

    - name: Fallback falls Update ohne auswertbare Service-Liste
      set_fact:
        changed_services: "{{ ['Update durchgeführt (Details siehe Log)'] }}"
      when:
        - output_up.changed | default(false)
        - (changed_services | default([]) | length) == 0

    - name: Sicherstellen, dass changed_services immer gesetzt ist
      set_fact:
        changed_services: "{{ changed_services | default([]) }}"

- name: Discord-Bericht senden
  hosts: localhost
  gather_facts: no
  tasks:

    - name: Bericht pro aktualisiertem Host senden
      uri:
        url: "{{ hostvars[item].webhook_url | default(webhook_url) }}"
        method: POST
        body_format: json
        body:
          username: "Ansible Update Bot"
          embeds:
            - title: "Docker Update: {{ item }}"
              color: 3066993
              description: "{{ hostvars[item].changed_services | join(', ') }}"
        status_code: 204
      loop: "{{ groups['all'] }}"
      when: hostvars[item].changed_services | default([]) | length > 0

    - name: "Meldung senden: keine Updates"
      uri:
        url: "{{ webhook_url }}"
        method: POST
        body_format: json
        body:
          username: "Ansible Update Bot"
          content: "keine Docker-Updates"
        status_code: 204
      when: groups['all'] | map('extract', hostvars, 'changed_services') | select('defined') | map('length') | sum == 0
