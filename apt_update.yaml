---
- name: Update APT cache and report number of upgradable packages
  hosts: debian
  become: yes
  gather_facts: yes
  ignore_unreachable: true
  any_errors_fatal: false
  tasks:
    - name: Refresh APT package cache (idempotent)
      ansible.builtin.apt:
        update_cache: yes
      tags:
        - apt
        - refresh_cache

    - name: Count upgradable APT packages
      ansible.builtin.shell: >
        apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: upgradable_count
      changed_when: false
      tags:
        - apt
        - report

    - name: Persist numeric count as a fact
      ansible.builtin.set_fact:
        upgradable_packages_count: "{{ upgradable_count.stdout | default('0') | int }}"
      when: upgradable_count is defined and upgradable_count.stdout is defined
      tags:
        - apt
        - report

    - name: Show upgradable package count for the host
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} has {{ upgradable_packages_count }} upgradable packages"
      when: upgradable_packages_count is defined
      tags:
        - apt
        - report

- name: Notify Discord about upgradable packages
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Build message content
      ansible.builtin.set_fact:
        discord_message: |
          📦 **APT Update-Check**
          {% for host in groups['debian'] %}
          {% if hostvars[host].upgradable_packages_count is defined %}
          **{{ host }}**: {{ hostvars[host].upgradable_packages_count }} Pakete verfügbar
          {% else %}
          **{{ host }}**: ⛔ nicht erreichbar
          {% endif %}
          {% endfor %}

    - name: Send Discord notification
      ansible.builtin.uri:
        url: "{{ webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "{{ discord_message }}"
        status_code: 204
      check_mode: false
