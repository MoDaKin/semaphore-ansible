---
- name: Update APT cache and report number of upgradable packages
  hosts: debian
  become: yes
  user: root
  gather_facts: yes

  tasks:
    - name: Refresh APT package cache (idempotent)
      ansible.builtin.apt:
        update_cache: yes
      tags:
        - apt
        - refresh_cache

    - name: Count upgradable APT packages
      ansible.builtin.shell: >
        apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: upgradable_count
      changed_when: false
      tags:
        - apt
        - report

    - name: Persist numeric count as a fact
      ansible.builtin.set_fact:
        upgradable_packages_count: "{{ upgradable_count.stdout | default('0') | int }}"
      tags:
        - apt
        - report

    - name: Show upgradable package count for the host
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} has {{ upgradable_packages_count }} upgradable packages"
      tags:
        - apt
        - report
